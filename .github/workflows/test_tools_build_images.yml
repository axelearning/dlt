name: tools | docker images

on:
  workflow_call:
  workflow_dispatch:

jobs:
  run_airflow:
    name: tools | docker images build
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@master

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          activate-environment: true
          enable-cache: true

      - name: Build images
        run: make test-build-images
